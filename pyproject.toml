[project]
name = "monitorul-ii"
version = "0.5.0"
description = "Scrape Monitorul Oficial Partea a II-a PDFs by date and convert them to markdown"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.2",
    "httpx>=0.28.1",
    "pymupdf4llm>=1.27.2.3",
    "python-dotenv>=1.2.2",
]

[project.scripts]
monitorul-ii = "monitorul_ii.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monitorul_ii"]
