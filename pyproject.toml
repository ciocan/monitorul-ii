[project]
name = "monitorul-ii"
version = "0.18.0"
description = "Scrape Monitorul Oficial Partea a II-a PDFs by date and convert them to markdown"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.2",
    "elasticsearch~=8.13",
    "httpx>=0.28.1",
    "json-repair>=0.30",
    "jsonschema>=4.23.0",
    "openai>=2.36.0",
    "pymupdf4llm>=1.27.2.3",
    "python-dotenv>=1.2.2",
    "rich>=13.0",
]

[project.scripts]
monitorul-ii = "monitorul_ii.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.15.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monitorul_ii"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
